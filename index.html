<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ayres Diversões</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--p:#84cc16;--pc:#111;--d:#1a2e05;--a:#84cc16;--ac:#111}
.bg-lime-500{background:var(--p)!important;color:var(--pc)!important}
.text-lime-600{color:var(--p)!important}
body{background:#f4f6f8;font-family:system-ui,sans-serif}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 10px #0001}
.in{width:100%;border:1px solid #e5e7eb;border-radius:12px;padding:10px 12px;outline:none;background:#fff}
.spin{width:18px;height:18px;border:3px solid currentColor;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
#pw::placeholder{color:#9ca3af;-webkit-text-fill-color:#9ca3af;opacity:1}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pulse{animation:p 1s infinite}@keyframes p{50%{opacity:.55}}
.pk.on,.mr.on{outline:2px solid var(--p);background:#f7fee7}
.b{border-radius:12px;padding:10px;font-weight:600}
</style></head>
<body>
<div id="login" class="min-h-screen flex items-center justify-center p-6" style="background:linear-gradient(160deg,var(--d),var(--p))">
  <div class="w-full max-w-xs text-center">
    <img id="logo" crossorigin="anonymous" src="https://i.ibb.co/pBmFHbbK/IMG-2768.jpg" alt="Ayres Diversões" class="w-40 h-40 mx-auto object-contain rounded-full bg-white p-1" style="box-shadow:0 0 0 5px rgba(255,255,255,.35),0 12px 30px #0006">
    <h1 class="text-white text-2xl font-extrabold mt-5 tracking-wide">AYRES DIVERSÕES</h1>
    <p class="text-white/70 text-sm mb-6">Locação de carrinhos</p>
    <div id="lmsg" class="text-white text-sm mb-3 font-semibold" style="min-height:1.25rem"></div>
    <input id="pw" type="password" placeholder="Senha" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" class="w-full rounded-2xl p-3.5 text-center outline-none shadow-lg" style="position:relative;z-index:5;display:block;background:#fff;color:#111;-webkit-text-fill-color:#111;opacity:1;border:2px solid rgba(255,255,255,.7);font-size:18px;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text;pointer-events:auto">
    <button id="go" class="w-full mt-3 rounded-2xl p-3.5 font-bold text-lg shadow-lg" style="background:var(--a);color:var(--ac)">Entrar</button>
  </div>
</div>
<div id="splash" class="hidden min-h-screen flex items-center justify-center" style="background:linear-gradient(160deg,var(--d),var(--p))"><div class="text-center text-white"><span class="spin" style="width:34px;height:34px"></span><div class="mt-3 font-semibold">Entrando...</div></div></div>
<div id="app" class="hidden pb-24 max-w-md mx-auto"></div>
<div id="alerts" style="position:fixed;left:0;right:0;top:0;z-index:60;pointer-events:none;padding:calc(env(safe-area-inset-top) + 8px) 12px 0"><div id="alin" class="max-w-md mx-auto"></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzIst60rgg6wlMP3ddfG-nu8LW24NbE3Rx3c-ZIQN5lxwBZa4fus_pmKM1kOFwXG8kb/exec';
const LOGO='https://i.ibb.co/pBmFHbbK/IMG-2768.jpg',PRECO=1.5;
const PK=[{m:10,b:0,p:15,l:'10 min'},{m:20,b:0,p:30,l:'20 min'},{m:30,b:0,p:45,l:'30 min'}];
let S={p:'',role:'',carts:[],loc:[],sig:''},tab=(()=>{try{return localStorage.getItem('ayres_tab')||'home'}catch(_){return 'home'}})(),ac,beeped={};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const setTab=t=>{tab=t;try{localStorage.setItem('ayres_tab',t)}catch(_){}render()};
const $=s=>document.querySelector(s);
const brl=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',');
const call=async(a,d={})=>{const r=await(await fetch(API,{method:'POST',body:JSON.stringify({a,p:S.p,...d})})).json();if(r.err)throw r.err;return r};
const mmss=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(ms/60)).padStart(2,'0')+':'+String(ms%60).padStart(2,'0')};
const isPula=l=>String(l.carrinho)=='PULA';
const cart=id=>String(id)=='PULA'?{nome:'Pula-pula',foto:''}:S.carts.find(c=>c.id==id)||{nome:'?',foto:''};
const PM=()=>(S.cfg&&+S.cfg.pulaMin)||1;
const byId=id=>S.loc.find(x=>x.id==id);
const ph=s=>String(s||'').replace(/\D/g,'');
const pg=x=>(+x.pix||0)+(+x.dinheiro||0)+(+x.debito||0)+(+x.credito||0);
const isToday=t=>new Date(+t).toDateString()==new Date().toDateString();
const hm=t=>new Date(+t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const lf=l=>l.status=='pausada'?+l.restante:+l.endAt-Date.now();
const inB=l=>l.status=='ativa'&&+l.bonusIni>0&&Date.now()>=+l.bonusIni;
const live=l=>l.status=='ativa'||l.status=='pausada';
const settled=x=>x.status=='finalizada'&&pg(x)>0;
const badge=l=>l.status=='cancelada'?['Cancelada','bg-gray-200 text-gray-600']:(pg(l)>=+l.valor-.005||settled(l))?['Pago','bg-green-100 text-green-700']:['Pendente','bg-amber-100 text-amber-800'];
const payPill=l=>{const rest=Math.max(0,+l.valor-pg(l));return rest<=.005?'<span class="inline-block mt-1 text-[11px] font-bold rounded-full px-2 py-0.5 bg-green-100 text-green-700">✔ PAGO</span>':`<span class="inline-block mt-1 text-[11px] font-bold rounded-full px-2 py-0.5 bg-amber-100 text-amber-800">⏳ PENDENTE · falta ${brl(rest)}</span>`};
const shown=x=>settled(x)?pg(x):+x.valor;
const meth=x=>[['Pix','pix'],['Dinheiro','dinheiro'],['Débito','debito'],['Crédito','credito']].filter(m=>+x[m[1]]>0).map(m=>m[0]+' '+brl(x[m[1]])).join(' · ');

/* Paleta automática a partir da logo */
const V=(p,v)=>document.documentElement.style.setProperty(p,v);
const applyPal=o=>Object.entries(o).forEach(([k,v])=>V(k,v));
try{const sv=localStorage.getItem('pal');sv&&applyPal(JSON.parse(sv))}catch(e){}
function pal(){try{
  const im=$('#logo'),c=document.createElement('canvas');c.width=c.height=48;const x=c.getContext('2d');x.drawImage(im,0,0,48,48);
  const d=x.getImageData(0,0,48,48).data,m={};
  for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);
    if(mx<50||mn>215||mx-mn<45)continue;const k=(r>>5)+','+(g>>5)+','+(b>>5),o=m[k]=m[k]||{n:0,r:0,g:0,b:0};o.n++;o.r+=r;o.g+=g;o.b+=b}
  const L=Object.values(m).sort((a,b)=>b.n-a.n).map(o=>[o.r/o.n,o.g/o.n,o.b/o.n].map(Math.round));if(!L.length)return;
  const hue=([r,g,b])=>{const mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);const h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;return(h*60+360)%360};
  const hd=(a,b)=>{const t=Math.abs(a-b);return Math.min(t,360-t)};
  const P=L[0],A=L.find(c=>hd(hue(c),hue(P))>40)||P,rgb=c=>`rgb(${c})`,ink=c=>(.299*c[0]+.587*c[1]+.114*c[2])>150?'#111':'#fff';
  const o={'--p':rgb(P),'--pc':ink(P),'--d':rgb(P.map(v=>Math.round(v*.3))),'--a':rgb(A),'--ac':ink(A)};
  applyPal(o);try{localStorage.setItem('pal',JSON.stringify(o))}catch(e){}
}catch(e){}}
$('#logo').onload=pal;if($('#logo').complete&&$('#logo').naturalWidth)pal();

/* Login (a sessão fica salva: localStorage, sessionStorage e window.name) */
const SK='ayres_sess';
function saveSess(){const j=JSON.stringify({p:S.p,role:S.role});try{localStorage.setItem(SK,j)}catch(_){}try{sessionStorage.setItem(SK,j)}catch(_){}try{window.name='AYRES'+j}catch(_){}}
function loadSess(){let j=null;try{j=localStorage.getItem(SK)}catch(_){}if(!j)try{j=sessionStorage.getItem(SK)}catch(_){}if(!j&&String(window.name).startsWith('AYRES'))j=window.name.slice(5);
  if(!j)try{const o=localStorage.getItem('ayres_pw');if(o)return{p:o}}catch(_){}
  try{return j?JSON.parse(j):null}catch(_){return null}}
function clearSess(){try{localStorage.removeItem(SK);localStorage.removeItem('ayres_pw')}catch(_){}try{sessionStorage.removeItem(SK)}catch(_){}try{window.name=''}catch(_){}}
const wait=ms=>new Promise(z=>setTimeout(z,ms));
let started=false;
async function entrar(auto){
  const b=$('#go');if(!auto)S.p=$('#pw').value;
  if(auto){$('#login').classList.add('hidden');$('#splash').classList.remove('hidden')}
  b.disabled=true;b.innerHTML='<span class="spin"></span>';$('#lmsg').textContent='';
  try{let r;
    for(let t=0;;t++){try{r=await call('login');break}catch(e){if(!auto||t>=2)throw e;await wait(1500)}}
    if(r.error)throw 'senha';if(!r.role)throw 'api';
    S.role=r.role;saveSess();
    try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(_){ac=null}
    $('#login').classList.add('hidden');$('#splash').classList.add('hidden');$('#app').classList.remove('hidden');
    await load(true);
    if(!started){started=true;setInterval(()=>load(),8000);setInterval(tick,1000)}
  }catch(e){b.disabled=false;b.textContent='Entrar';$('#splash').classList.add('hidden');$('#login').classList.remove('hidden');
    if(auto){if(e=='senha'){clearSess();$('#lmsg').textContent='A senha foi alterada. Digite a nova senha.'}else $('#lmsg').textContent='Não consegui conectar ao servidor. Verifique a internet e entre novamente.'}
    else{$('#pw').classList.add('shake');setTimeout(()=>$('#pw').classList.remove('shake'),400);$('#pw').value='';$('#pw').placeholder=e=='senha'?'Senha incorreta':'Erro de conexão com o servidor'}}
}
function sair(){clearSess();location.reload()}
$('#go').onclick=()=>entrar(false);
$('#login').addEventListener('click',e=>{if(e.target.id!='go')$('#pw').focus()});
$('#pw').onkeydown=e=>{if(e.key=='Enter')$('#go').click()}; /* sem 'return false': isso bloqueava a digitação */
{const ss=loadSess();if(ss&&ss.p){S.p=ss.p;if(ss.role)S.role=ss.role;entrar(true)}}

/* Dados */
async function load(f){try{const r=await call('state'),sg=JSON.stringify(r),ch=sg!=S.sig;S.sig=sg;S.carts=r.carts;S.loc=r.loc;S.cfg=r.cfg||S.cfg;if(f===true||(ch&&tab!='cad'))render()}catch(e){}}
async function refresh(){const i=$('#rf');i&&i.classList.add('spin');await load(true);const j=$('#rf');j&&j.classList.remove('spin')}
function beep(n=3){if(!ac)return;if(ac.state=='suspended')ac.resume();[0,.4,.8].slice(0,n).forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.4,ac.currentTime+t);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.3)});navigator.vibrate&&navigator.vibrate([300,100,300,100,300])}
function tick(){S.loc.filter(live).forEach(l=>{
  const left=lf(l),end=l.status=='ativa'&&left<=0;
  document.querySelectorAll(`.tm[data-id="${l.id}"]`).forEach(e=>e.textContent=mmss(left));
  document.querySelectorAll(`.lb[data-id="${l.id}"]`).forEach(e=>e.textContent=end?'Tempo esgotado! Toque':l.status=='pausada'?'pausado':inB(l)?'de bônus':'restantes');
  document.querySelectorAll(`.el[data-id="${l.id}"]`).forEach(e=>e.textContent=Math.max(0,Math.floor(((+l.minutos+(+l.bonus||0))*60000-left)/60000))+' min');
  document.querySelectorAll(`.es[data-id="${l.id}"]`).forEach(e=>e.classList.toggle('hidden',!end));
  document.querySelectorAll(`[data-card="${l.id}"]`).forEach(e=>e.classList.toggle('pulse',end));});alerts()}

/* Alertas: aviso 30s antes e tempo esgotado */
let DIS={},alSig='';try{DIS=JSON.parse(localStorage.getItem('dis')||'{}')}catch(e){}
const saveDis=()=>{try{localStorage.setItem('dis',JSON.stringify(DIS))}catch(e){}};
const key=l=>l.id+':'+l.endAt;
function alerts(){
  const ws=[],es=[];
  S.loc.filter(l=>l.status=='ativa').forEach(l=>{const left=+l.endAt-Date.now(),k=key(l);
    if(left<=0){if(!DIS['e'+k])es.push(l)}else if(left<=30000){if(!DIS['w'+k])ws.push(l)}});
  ws.forEach(l=>{const k='w'+key(l);if(!beeped[k]){beeped[k]=1;beep(1)}});
  es.forEach(l=>{const k='e'+key(l);if(!beeped[k]){beeped[k]=1;beep(3)}});
  const sig=ws.map(key).join()+'|'+es.map(key).join();if(sig==alSig)return;alSig=sig;
  const nm=l=>`<b>${l.cliente||'Cliente'}</b> · ${cart(l.carrinho).nome}<br>${payPill(l)}`;
  $('#alin').innerHTML=es.map(l=>`<div style="pointer-events:auto;background:linear-gradient(135deg,#dc2626,#e11d48);color:#fff;border-radius:18px;padding:14px;margin-bottom:8px;box-shadow:0 8px 24px #0005"><div class="font-extrabold">⚠️ ATENÇÃO: Tempo Esgotado!</div><div class="text-sm mb-2">${nm(l)}</div><div class="flex gap-2"><button onclick="bonus('${l.id}',2)" class="b flex-1 bg-white text-red-700 text-sm">🎁 +2 min bônus</button><button onclick="bonus('${l.id}',5)" class="b flex-1 bg-white text-red-700 text-sm">🎁 +5 min bônus</button><button onclick="disE('${l.id}')" class="b flex-1 text-white text-sm" style="background:#7f1d1d">🔇 Dispensar de vez</button></div></div>`).join('')+
   ws.map(l=>`<div style="pointer-events:auto;background:#f59e0b;color:#111;border-radius:18px;padding:12px 14px;margin-bottom:8px;box-shadow:0 8px 24px #0004" class="flex items-center gap-3"><div class="flex-1 text-sm">⏰ <b>Faltam 30 segundos!</b><br>${nm(l)}</div><button onclick="disW('${l.id}')" class="b bg-white text-sm">OK</button></div>`).join('')}
function disW(id){const l=S.loc.find(x=>x.id==id);if(l){DIS['w'+key(l)]=1;saveDis();alerts()}}
function disE(id){const l=S.loc.find(x=>x.id==id);if(l){DIS['e'+key(l)]=1;saveDis();alerts()}}
async function bonus(id,m){const l=S.loc.find(x=>x.id==id);if(l){DIS['e'+key(l)]=1;saveDis();alerts()}
  try{await call('bonus',{id,min:m});await load(true)}catch(e){alert('Erro: '+e)}}

/* Telas */
function render(){
  const tabs=S.role=='admin'?[['home','🏎️','Carrinhos'],['pula','🤸','Pula-pula'],['cad','➕','Cadastro'],['rel','📊','Relatório'],['his','🕘','Histórico']]:[['home','🏎️','Carrinhos'],['pula','🤸','Pula-pula'],['rel','📊','Relatório']];
  if(!tabs.some(t=>t[0]==tab))tab='home';
  $('#app').innerHTML=`<header class="flex items-center gap-2 p-3 text-white" style="background:linear-gradient(135deg,var(--d),var(--p));padding-top:calc(env(safe-area-inset-top) + .75rem)">
    <img src="${LOGO}" class="w-10 h-10 rounded-full bg-white p-0.5 object-contain"><b class="flex-1 leading-tight">Ayres Diversões</b>
    <span class="text-xs font-bold bg-white/90 text-gray-800 rounded-full px-3 py-1">${S.role=='admin'?'Admin':'Funcionário'}</span>
    <button onclick="refresh()" class="text-xl px-1" aria-label="Atualizar"><span id="rf" style="display:inline-block;width:20px;height:20px;line-height:20px;text-align:center">↻</span></button>
    <button onclick="sair()" class="text-sm opacity-90 px-1">Sair</button></header>
  <div class="p-4">${{home,pula,cad,rel,his}[tab]()}</div>
  <nav class="fixed bottom-0 inset-x-0 bg-white border-t flex justify-around max-w-md mx-auto" style="padding-bottom:env(safe-area-inset-bottom)">${tabs.map(t=>`<button onclick="setTab('${t[0]}')" class="flex-1 py-2 text-xs ${tab==t[0]?'text-lime-600 font-bold':'text-gray-400'}"><div class="text-xl">${t[1]}</div>${t[2]}</button>`).join('')}</nav>`;
  tick();
}
function home(){
  const bat=c=>{const d=c.status=='sem_bateria';return `<div class="flex gap-2 mt-2" onclick="event.stopPropagation()"><button onclick="setBat('${c.id}','')" class="b flex-1 text-xs ${d?'bg-gray-200 text-gray-500':'bg-green-600 text-white'}" style="padding:7px 4px">🔋 Carregado</button><button onclick="setBat('${c.id}','sem_bateria')" class="b flex-1 text-xs ${d?'bg-red-600 text-white':'bg-gray-200 text-gray-500'}" style="padding:7px 4px">🪫 Descarregado</button></div>`};
  const rk=c=>S.loc.some(l=>live(l)&&l.carrinho==c.id)?1:c.status=='sem_bateria'?2:0;
  const act=S.loc.filter(l=>live(l)&&!isPula(l)),n=S.carts.length,occ=c=>act.some(l=>l.carrinho==c.id),sb=S.carts.filter(c=>c.status=='sem_bateria'&&!occ(c)).length;
  let h=`<div class="flex gap-2 mb-4 text-center">${[['Carrinhos',n],['Ocupados',act.length],['Livres',Math.max(0,n-act.length-sb)],['Descarreg.',sb]].map(x=>`<div class="card flex-1 p-2"><div class="text-2xl font-bold">${x[1]}</div><div class="text-[10px] text-gray-500">${x[0].toUpperCase()}</div></div>`).join('')}</div><div class="font-semibold mb-2">Frota de Carrinhos <span class="text-xs font-normal text-gray-400">· R$ 1,50/min</span></div>`;
  if(!n)h+='<p class="text-gray-400 text-center mt-10">Nenhum carrinho cadastrado.</p>';
  return h+S.carts.slice().sort((a,b)=>rk(a)-rk(b)).map(c=>{
    const a=act.find(l=>l.carrinho==c.id);
    if(!a&&c.status=='sem_bateria')return `<div onclick="entry('${c.id}')" class="card p-3 mb-3 border-l-4 border-gray-400 bg-gray-100"><div class="flex items-center gap-3"><img src="${c.foto}" class="w-20 h-16 object-contain rounded-lg" style="filter:grayscale(1);opacity:.7"><div class="flex-1"><b class="text-gray-600">${c.nome}</b><div class="text-xs text-gray-600">🪫 DESCARREGADO</div></div></div>${bat(c)}</div>`;
    if(!a)return `<div onclick="entry('${c.id}')" class="card p-3 mb-3 border-l-4 border-green-500"><div class="flex items-center gap-3"><img src="${c.foto}" class="w-20 h-16 object-contain rounded-lg"><div class="flex-1"><b>${c.nome}</b><div class="text-xs text-green-600">● LIVRE · 🔋 carregado</div></div><span class="text-xs text-gray-400">toque p/ iniciar</span></div>${bat(c)}</div>`;
    const p=a.status=='pausada',bn=inB(a);
    return `<div data-card="${a.id}" onclick="panel('${a.id}')" class="card p-3 mb-3 flex items-center gap-3 border-l-4 ${p?'border-amber-400 bg-amber-50':bn?'border-purple-400 bg-purple-100':'border-red-500 bg-red-50'}"><img src="${c.foto}" class="w-20 h-16 object-contain rounded-lg"><div class="flex-1 min-w-0"><b>${c.nome}</b><div class="text-xs ${p?'text-amber-700':bn?'text-purple-700':'text-red-600'}">● ${p?'PAUSADO':bn?'BÔNUS':'OCUPADO'} · ${a.cliente||''}</div><div class="text-xs text-gray-500">${a.minutos} min · ${brl(a.valor)}</div><div ${(+a.valor-pg(a))>.005?`onclick="event.stopPropagation();pagar('${a.id}')"`:''}>${payPill(a)}</div></div><div class="text-right"><div class="tm text-2xl font-bold" data-id="${a.id}"></div><div class="lb text-xs text-red-500" data-id="${a.id}"></div></div></div>`}).join('');
}

/* ===== PULA-PULA (R$ por hora, por criança) ===== */
async function pAct(a,id,x={}){try{await call(a,{id,...x});await load(true)}catch(e){alert('Erro: '+e)}}
function pMais(id){const m=+prompt(`Quantos minutos adicionar? (${brl(PM())} por minuto, por criança)`,'10');if(m>0)pAct('more',id,{min:m})}
function pBonus(id){const m=+prompt('Quantos minutos de BÔNUS (sem cobrar)?','1');if(m>0)pAct('bonus',id,{min:m})}
function pula(){
  const L=S.loc.filter(l=>live(l)&&isPula(l)),kids=L.reduce((s,l)=>s+(+l.qtd||1),0);
  let h=`<h2 class="text-2xl font-extrabold">Painel de Controle</h2><div class="text-gray-500 mb-3">Tarifa: ${brl(PM())} por minuto (por criança)</div>
  <div class="mb-3"><button onclick="entryPula()" class="b w-full text-white font-bold" style="border-radius:16px;padding:14px;background:linear-gradient(135deg,#059669,#0d9488);box-shadow:0 8px 20px #05966955">＋ Nova Entrada</button></div>
  <div class="text-sm text-gray-500 mb-3">🤸 Brincando agora: <b>${kids}</b> ${kids==1?'criança':'crianças'}</div>`;
  if(!L.length)return h+'<p class="text-gray-400 text-center mt-10">Ninguém no pula-pula agora.<br>Toque em “Nova Entrada”.</p>';
  return h+L.map(l=>{const p=l.status=='pausada',bd=badge(l),left=lf(l),end=l.status=='ativa'&&left<=0,bn=inB(l),q=+l.qtd||1;

async function setBat(id,st){const c=S.carts.find(x=>x.id==id);if(!c||(c.status||'')==st)return;

function swap(l){

function cancelar(l){
  const R=isPula(l)?['Criança não quis brincar','Criança com medo / chorou','Responsável desistiu','Entrou por engano']:['Criança não quis brincar','Criança com medo / chorou','Responsável desistiu','Carrinho sem bateria / com defeito','Entrou por engano'];
  const d=M(`<h2 class="text-xl font-bold mb-1">Cancelar locação</h2><div class="text-sm text-gray-500 mb-3">${esc(l.cliente)} · ${esc(cart(l.carrinho).nome)}</div>
  ${pg(l)>0?`<div class="bg-amber-50 text-amber-800 text-sm rounded-xl p-2 mb-3">⚠️ Já foi pago ${brl(pg(l))}. Lembre de devolver ao cliente.</div>`:''}
  <label class="text-sm text-gray-600">Motivo da desistência</label>
  <div class="flex flex-wrap gap-2 my-2">${R.map(r=>`<button type="button" class="mr b bg-gray-100 text-xs" style="padding:8px 10px">${r}</button>`).join('')}</div>
  <textarea id="c-m" rows="3" class="in" placeholder="Escreva ou escolha o motivo (obrigatório)"></textarea>
  <div class="flex gap-3 mt-4"><button class="b flex-1 bg-gray-100" id="c-x">Voltar</button><button class="b flex-1 text-white" style="background:#dc4f4a" id="c-ok">Cancelar locação</button></div>`);
  const g=s=>d.querySelector(s);
  d.querySelectorAll('.mr').forEach(b=>b.onclick=()=>{g('#c-m').value=b.textContent;d.querySelectorAll('.mr').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  g('#c-x').onclick=()=>isPula(l)?d.remove():panel(l.id);
  g('#c-ok').onclick=async()=>{const m=g('#c-m').value.trim();if(!m)return alert('Informe o motivo da desistência');
    const b=g('#c-ok');b.disabled=true;b.innerHTML='<span class="spin"></span>';
    try{await call('cancel',{id:l.id,motivo:m});d.remove();await load(true)}catch(e){b.disabled=false;b.textContent='Cancelar locação';alert('Erro: '+e)}}}
function edit(l){
  const d=M(`<h2 class="text-xl font-bold mb-3">Editar dados</h2><label class="text-sm text-gray-600">Nome do Cliente</label><input id="d-n" class="in mb-2" value="${l.cliente||''}"><label class="text-sm text-gray-600">Referência</label><input id="d-r" class="in mb-2" value="${l.ref||''}"><label class="text-sm text-gray-600">Celular</label><input id="d-c" type="tel" class="in mb-3" value="${l.cel||''}"><div class="flex gap-3"><button class="b flex-1 bg-gray-100" id="d-x">Voltar</button><button class="b flex-1 bg-lime-500" id="d-ok">Salvar</button></div>`);
  d.querySelector('#d-x').onclick=()=>isPula(l)?d.remove():panel(l.id);
  d.querySelector('#d-ok').onclick=async()=>{try{await call('edit',{id:l.id,cliente:d.querySelector('#d-n').value.trim(),ref:d.querySelector('#d-r').value.trim(),cel:ph(d.querySelector('#d-c').value)});await load(true);isPula(l)?d.remove():panel(l.id)}catch(e){alert('Erro: '+e)}}}
function fin(l){
  const rest=Math.max(0,+l.valor-pg(l));
  const d=M(`<h2 class="text-xl font-bold mb-1">Finalizar — ${l.cliente||''}</h2><div class="flex justify-between my-3"><div><div class="text-xs text-gray-400">Valor</div><b class="text-xl">${brl(l.valor)}</b></div><div><div class="text-xs text-gray-400">Já pago</div><b class="text-xl">${brl(pg(l))}</b></div><div><div class="text-xs text-gray-400">A receber</div><b class="text-xl text-red-600">${brl(rest)}</b></div></div>
  ${rest>0?`<div class="text-xs font-bold text-gray-600 mb-1">Formas de Pagamento:</div>${payHTML('fp')}<label class="flex items-start gap-2 text-sm mt-3 bg-purple-50 rounded-xl p-2"><input type="checkbox" id="f-cor" class="mt-1"><span>🎁 <b>Não cobrar o restante</b> (cortesia / tempo não cobrado)</span></label><div id="f-cmw" class="hidden mt-2"><input id="f-cm" class="in" placeholder="Motivo (obrigatório). Ex: pai pediu +1 min, não cobrado"><div class="text-xs text-gray-500 mt-1">O valor da locação passa a ser só o que foi pago. O motivo fica registrado.</div></div>`:'<div class="text-center text-green-600 font-semibold">Tudo pago ✔</div>'}
  <div class="flex gap-3 mt-4"><button class="b flex-1 bg-gray-100" id="f-x">Voltar</button><button class="b flex-1 text-white" style="background:#dc4f4a" id="f-ok">Finalizar</button></div>`);
  const g=s=>d.querySelector(s);let pay={};
  if(rest>0){payBind(d,'fp');g('#fp-dinheiro').value=rest.toFixed(2);g('#fp-t').textContent=brl(rest);
    g('#f-cor').onchange=()=>{const on=g('#f-cor').checked;g('#f-cmw').classList.toggle('hidden',!on);['pix','dinheiro','debito','credito'].forEach(k=>g('#fp-'+k).value='');
      if(on){g('#fp-t').textContent=brl(0);g('#f-cm').focus()}else{g('#fp-dinheiro').value=rest.toFixed(2);g('#fp-t').textContent=brl(rest)}}}
  g('#f-x').onclick=()=>isPula(l)?d.remove():panel(l.id);
  g('#f-ok').onclick=async()=>{let extra={};if(rest>0){pay=payVals(d,'fp');const cor=g('#f-cor').checked;
    if(cor){const m=g('#f-cm').value.trim();if(!m)return alert('Informe o motivo de não cobrar o restante');const novo=pg(l)+pg(pay),sobra=+l.valor-novo;if(sobra>.005)extra={valor:novo,obs:`Cortesia: ${brl(sobra)} não cobrado — ${m} (${new Date().toLocaleString('pt-BR')})`}}
    else if(pg(pay)<rest-.005&&!confirm(`Falta ${brl(rest-pg(pay))}. Finalizar mesmo assim? Será registrado como Pago com o valor recebido.`))return}
    const b=g('#f-ok');b.disabled=true;b.innerHTML='<span class="spin"></span>';
    try{await call('end',{id:l.id,...pay,...extra});d.remove();await load(true)}catch(e){b.disabled=false;b.textContent='Finalizar';alert('Erro: '+e)}}}

/* Cadastro de carrinhos (admin) */
function cad(){return `<div class="card p-4 mb-4"><b>Novo carrinho</b><input id="nm" placeholder="Ex: Drift Vermelho" class="in mt-2"><input id="ft" type="file" accept="image/*" class="w-full mt-2 text-sm"><button onclick="addC()" class="b w-full mt-3 bg-lime-500">Cadastrar</button></div>`+S.carts.map(c=>`<div class="card p-3 mb-2 flex items-center gap-3"><img src="${c.foto}" class="w-14 h-12 object-contain rounded-lg"><b class="flex-1">${c.nome}</b><button onclick="delC('${c.id}')" class="text-red-500">🗑</button></div>`).join('')}
function addC(){
  const nome=$('#nm').value.trim(),f=$('#ft').files[0];if(!nome||!f)return alert('Informe nome e foto');
  const bt=event.target;bt.disabled=true;bt.textContent='Salvando...';
  const fail=m=>{bt.disabled=false;bt.textContent='Cadastrar';alert(m)};
  const im=new Image();
  im.onerror=()=>fail('Não consegui ler a foto. Tente outra imagem (JPG ou PNG).');
  im.onload=async()=>{
    let w=280,q=.7,foto;
    do{const k=Math.min(1,w/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);foto=c.toDataURL('image/jpeg',q);w-=40;q-=.1}while(foto.length>40000&&w>80);
    try{await call('addCart',{nome,foto});await load(true)}catch(e){fail('Erro ao salvar: '+e)}
  };
  im.src=URL.createObjectURL(f)}
async function delC(id){if(confirm('Excluir carrinho?')){await call('delCart',{id});load(true)}}

/* Relatório e histórico */
function lines(l){return l.map(x=>{const b=badge(x),m=meth(x);return `<div class="card p-3 mb-2 flex justify-between gap-2"><div class="min-w-0"><b>${x.cliente||'Cliente'}</b> <span class="text-xs text-gray-400">${cart(x.carrinho).nome}</span><div class="text-xs text-gray-500">${new Date(+x.inicio).toLocaleString('pt-BR')} · ${x.minutos} min${isPula(x)?' · 👥 '+(x.qtd||1):''}${x.cel?' · '+x.cel:''}</div>${m?`<div class="text-xs text-gray-500 mt-0.5">${m}</div>`:''}${S.role=='admin'&&+x.bonus>0?`<div class="text-xs text-purple-600 mt-0.5">🎁 bônus: ${x.bonus} min</div>`:''}${S.role=='admin'&&x.obs?`<div class="text-xs text-indigo-500 mt-0.5">📝 ${esc(x.obs)}</div>`:''}${x.status=='cancelada'&&x.motivo?`<div class="text-xs text-red-500 mt-0.5">Motivo: ${esc(x.motivo)}</div>`:''}</div><div class="text-right"><b>${brl(shown(x))}</b><div class="text-[11px] ${b[1]} rounded px-2">${b[0]}</div>${S.role=='admin'&&x.status!='cancelada'?`<button onclick="editPay('${x.id}')" class="text-[11px] text-indigo-600 underline mt-1">✎ editar pagamento</button>`:''}</div></div>`}).join('')||'<p class="text-gray-400 text-center mt-6">Sem registros.</p>'}
const ymd=t=>new Date(+t-new Date(+t).getTimezoneOffset()*60000).toISOString().slice(0,10);
let RF={f:ymd(Date.now()),t:ymd(Date.now())};
const dm=v=>v.split('-').reverse().join('/');
function setRF(k,v){if(!v)return;RF[k]=v;if(RF.f>RF.t){if(k=='f')RF.t=RF.f;else RF.f=RF.t}render()}
function quick(q){const d=new Date(),h=ymd(d);
  if(q=='hoje')RF={f:h,t:h};
  else if(q=='ontem'){d.setDate(d.getDate()-1);RF={f:ymd(d),t:ymd(d)}}
  else if(q=='7'){d.setDate(d.getDate()-6);RF={f:ymd(d),t:h}}
  else if(q=='mes'){d.setDate(1);RF={f:ymd(d),t:h}}
  render()}
let RK='todos';
const scope=()=>S.loc.filter(x=>RK=='pula'?isPula(x):RK=='cart'?!isPula(x):true);
function chipsRK(){return `<div class="flex gap-2 mb-3">${[['todos','Todos'],['cart','Carrinhos'],['pula','Pula-pula']].map(c=>`<button onclick="RK='${c[0]}';render()" class="b flex-1 text-xs ${RK==c[0]?'text-white':'bg-gray-100 text-gray-600'}" style="padding:8px 4px;${RK==c[0]?'background:#475569':''}">${c[1]}</button>`).join('')}</div>`}
function rel(){return chipsRK()+rel0()}
function rel0(){
  if(S.role!='admin'){const l=scope().filter(x=>isToday(x.inicio)&&x.status!='cancelada'),mins=l.reduce((s,x)=>s+ +x.minutos,0);
    return `<div class="card p-4 mb-3 text-center"><div class="text-3xl font-bold text-lime-600">${l.length}</div><div class="text-sm">locações hoje · ${mins} min</div></div>`+lines(l.slice().reverse())}
  const a=new Date(RF.f+'T00:00:00').getTime(),z=new Date(RF.t+'T23:59:59.999').getTime(),hoje=ymd(Date.now()),um=RF.f==RF.t;
  const l=scope().filter(x=>+x.inicio>=a&&+x.inicio<=z&&x.status!='cancelada'),mins=l.reduce((s,x)=>s+ +x.minutos,0);
  const cn=scope().filter(x=>+x.inicio>=a&&+x.inicio<=z&&x.status=='cancelada');
  const sum=k=>l.reduce((s,x)=>s+(+x[k]||0),0),rec=l.reduce((s,x)=>s+pg(x),0),pend=l.reduce((s,x)=>s+(settled(x)?0:Math.max(0,+x.valor-pg(x))),0);
  const qr=(()=>{const h=ymd(Date.now()),o=n=>{const x=new Date();x.setDate(x.getDate()-n);return ymd(x)},m=new Date();m.setDate(1);
    if(RF.f==h&&RF.t==h)return 'hoje';if(RF.f==o(1)&&RF.t==o(1))return 'ontem';if(RF.f==o(6)&&RF.t==h)return '7';if(RF.f==ymd(m)&&RF.t==h)return 'mes';return ''})();
  const qb=(q,t)=>`<button onclick="quick('${q}')" class="b text-xs flex-1 ${qr==q?'text-white':'bg-gray-100 text-gray-600'}" style="padding:6px 2px;${qr==q?'background:#475569':''}">${t}</button>`;
  let days='';
  if(!um){const g={};l.forEach(x=>{const d=ymd(x.inicio),o=g[d]=g[d]||{n:0,v:0};o.n++;o.v+=pg(x)});
    days=`<div class="font-semibold mb-2">Por dia</div><div class="card p-3 mb-4">${Object.keys(g).sort().reverse().map(d=>`<div class="flex justify-between text-sm py-1 border-b last:border-0"><span>${dm(d).slice(0,5)}</span><span class="text-gray-500">${g[d].n} locações</span><b>${brl(g[d].v)}</b></div>`).join('')||'<div class="text-gray-400 text-center text-sm">Sem registros.</div>'}</div>`}
  return `<div class="card p-2 mb-3"><div class="flex items-center gap-1.5 mb-2"><span class="text-[11px] text-gray-500">De</span><input type="date" class="in" style="padding:4px 6px;font-size:13px;flex:1;min-width:0;width:auto" value="${RF.f}" max="${hoje}" onchange="setRF('f',this.value)"><span class="text-[11px] text-gray-500">Até</span><input type="date" class="in" style="padding:4px 6px;font-size:13px;flex:1;min-width:0;width:auto" value="${RF.t}" max="${hoje}" onchange="setRF('t',this.value)"></div><div class="flex gap-1.5">${qb('hoje','Hoje')}${qb('ontem','Ontem')}${qb('7','7 dias')}${qb('mes','Este mês')}</div></div>
  <div class="card p-4 mb-3 text-center"><div class="text-sm text-gray-500">${um?(RF.f==hoje?'Recebido hoje':'Recebido em '+dm(RF.f)):'Recebido de '+dm(RF.f).slice(0,5)+' a '+dm(RF.t).slice(0,5)}</div><div class="text-3xl font-bold text-lime-600">${brl(rec)}</div><div class="text-sm">${l.length} locações · ${mins} min · A receber ${brl(pend)}</div></div>
  <div class="grid grid-cols-2 gap-2 mb-4">${[['Pix','pix'],['Dinheiro','dinheiro'],['Débito','debito'],['Crédito','credito']].map(x=>`<div class="card p-3 text-center"><div class="text-xs text-gray-500">${x[0]}</div><b>${brl(sum(x[1]))}</b></div>`).join('')}</div>`+days+`<div class="font-semibold mb-2">Locações</div>`+lines(l.slice().reverse())+(cn.length?`<div class="font-semibold mt-4 mb-2">Desistências (${cn.length})</div>`+lines(cn.slice().reverse()):'')}
function his(){return chipsRK()+`<div class="font-semibold mb-2">Histórico</div>`+lines(scope().slice().reverse())}
</script></body></html>
